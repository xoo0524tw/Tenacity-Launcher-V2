<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenacity Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="/src/assets/logo.png" alt="Tenacity logo" />
          <div class="brand-text">
            <h1>TENACITY</h1>
            <span>LAUNCHER</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
            <svg class="icon-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
            <svg id="icon-sun" class="icon-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
            <svg id="icon-moon" class="icon-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button id="discord-btn" class="btn-discord" title="Join our Discord">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"></path>
            </svg>
            <span>Join Discord</span>
          </button>
        </div>
      </header>

      <main class="content">
        <section class="panel versions-panel">
          <div class="panel-head">
            <h2>VERSION MANAGER</h2>
            <button id="refresh-btn" class="btn-ghost" title="Refresh versions">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                <path d="M21 3v6h-6"></path>
              </svg>
              <span>Refresh</span>
            </button>
          </div>

          <div class="section-block">
            <h3 class="section-title"><span class="dot dot-blue"></span> INSTALLED</h3>
            <div id="installed-list" class="version-list"></div>
            <div id="installed-empty" class="empty-state">
              <p>No versions installed yet.</p>
              <p class="empty-hint">Pick a release below and hit Install.</p>
            </div>
          </div>

          <div class="section-block">
            <h3 class="section-title"><span class="dot dot-pink"></span> AVAILABLE ON GITHUB</h3>
            <div id="available-list" class="version-list"></div>
            <div id="available-empty" class="empty-state">
              <p>Fetching releases from GitHub…</p>
            </div>
          </div>
        </section>

        <aside class="panel launch-panel">
          <div class="selected-card">
            <div class="selected-meta">
              <span class="label">SELECTED VERSION</span>
              <span id="selected-tag" class="selected-tag">—</span>
            </div>
            <button id="launch-btn" class="btn-play" disabled>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"></path>
              </svg>
              PLAY
            </button>
            <div id="launch-status" class="launch-status"></div>
          </div>

          <div class="console-card">
            <h3 class="section-title">CONSOLE</h3>
            <div id="console" class="console"></div>
          </div>
        </aside>
      </main>
    </div>

    <div id="settings-overlay" class="overlay" hidden>
      <div class="overlay-card">
        <div class="overlay-head">
          <h2>SETTINGS</h2>
          <button id="settings-close" class="overlay-close" title="Close">×</button>
        </div>
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">JAVA RUNTIME</span>
            <p id="java-status" class="setting-status">Checking…</p>
          </div>
          <div class="setting-actions">
            <button id="java-browse" class="btn-mini">Browse…</button>
            <button id="java-auto" class="btn-mini">Auto-detect</button>
            <button id="java-reset" class="btn-mini btn-mini-danger">Reset</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">RUNTIME FOLDER (files/)</span>
            <p id="files-status" class="setting-status">Checking…</p>
          </div>
          <div class="setting-actions">
            <button id="files-browse" class="btn-mini">Browse…</button>
            <button id="files-reset" class="btn-mini btn-mini-danger">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
